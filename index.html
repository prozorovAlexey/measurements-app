<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Замеры</title>
  <meta name="description" content="Личный трекер замеров тела: последние значения, ввод сессии, история.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="appbar">
      <h1 class="appbar__title" id="screen-title">Замеры</h1>
      <span class="status" id="header-status" role="status" aria-live="polite" hidden></span>
    </header>

    <main id="app" class="screen"></main>

    <nav class="tabbar" aria-label="Основная навигация">
      <a class="tabbar__item" href="#/" data-tab="figure">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="5.5" r="2.5"></circle>
          <path d="M8.5 10c1.1-1.1 2.2-1.6 3.5-1.6s2.4.5 3.5 1.6l1.2 4.2M7.3 14.2l1.6-4.1M9.1 13.2l-.5 6.3M14.9 13.2l.5 6.3M9 19.5h2.1L12 13l.9 6.5H15"></path>
        </svg>
        <span class="tabbar__label">Фигура</span>
      </a>
      <a class="tabbar__item" href="#/sizes" data-tab="sizes">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3.5" y="9.5" width="17" height="5" rx="1"></rect>
          <path d="M7 9.5v2.2M10.5 9.5v2.2M14 9.5v2.2M17.5 9.5v2.2"></path>
        </svg>
        <span class="tabbar__label">Размеры</span>
      </a>
      <a class="tabbar__item" href="#/settings" data-tab="settings">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 8h9M17.5 8H20M4 16h3.5M12 16h8"></path>
          <circle cx="15" cy="8" r="2.2"></circle>
          <circle cx="9.5" cy="16" r="2.2"></circle>
        </svg>
        <span class="tabbar__label">Настройки</span>
      </a>
    </nav>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
